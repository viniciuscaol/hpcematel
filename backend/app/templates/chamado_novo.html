{% extends "base.html" %}
{% block title %}Novo Chamado - {{ app_name }}{% endblock %}
{% block content %}
<div class="app-shell">
  {% include "partials/topbar.html" %}

  <main class="content">
    <h1>Novo Chamado</h1>

    {% if erro_validacao %}
    <p class="error-message">{{ erro_validacao }}</p>
    {% endif %}

    <form hx-post="/chamados/novo" hx-target="#form-erro" hx-swap="innerHTML" class="chamado-form">

      <label for="cliente_busca">Cliente</label>
      <div class="cliente-busca-wrapper">
        <input
          type="text" id="cliente_busca" name="termo" placeholder="Digite o nome do cliente..."
          hx-get="/clientes/buscar" hx-trigger="keyup changed delay:400ms"
          hx-target="#clientes-resultado" hx-swap="innerHTML" autocomplete="off"
        >
        <div id="clientes-resultado"></div>
      </div>
      <div id="cliente-selecionado"></div>

      <label for="titulo">Título</label>
      <input type="text" id="titulo" name="titulo" required maxlength="255">
      <span class="contador-caracteres" id="contador-titulo">0/255</span>

      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao" rows="5" maxlength="5000"></textarea>
      <span class="contador-caracteres" id="contador-descricao">0/5000</span>

      <label>Categorias</label>
      <div class="categoria-pills">
        {% for categoria in categorias %}
        <label class="categoria-pill" data-nome="{{ categoria.nome | lower }}">
          <input type="checkbox" name="categoria_ids" value="{{ categoria.id }}" class="categoria-checkbox">
          <span>{{ categoria.nome }}</span>
        </label>
        {% endfor %}
      </div>

      <div id="rastreio-correios" style="display:none;">
        <label for="codigo_rastreio_envio">Código de rastreio (envio)</label>
        <input type="text" id="codigo_rastreio_envio" name="codigo_rastreio_envio" placeholder="Opcional">
      </div>

      <label for="prioridade_id">Prioridade</label>
      <select id="prioridade_id" name="prioridade_id" required>
        {% for prioridade in prioridades %}
        <option value="{{ prioridade.id }}">{{ prioridade.nome }}</option>
        {% endfor %}
      </select>

      <label for="responsavel_codigo">Responsável</label>
      <select id="responsavel_codigo" name="responsavel_codigo" required>
        {% for resp in responsaveis %}
        <option value="{{ resp.codigo }}" {% if resp.codigo == usuario.codigo %}selected{% endif %}>{{ resp.nome }}</option>
        {% endfor %}
      </select>

      <div id="form-erro"></div>

      <button type="submit" hx-disabled-elt="this">Criar chamado</button>
    </form>
  </main>
</div>
<script>
(function () {
  var rastreioDiv = document.getElementById('rastreio-correios');
  var checkboxes = document.querySelectorAll('.categoria-checkbox');
  function atualizar() {
    var marcadoCorreios = Array.from(checkboxes).some(function (cb) {
      return cb.checked && cb.closest('.categoria-pill').dataset.nome === 'correios';
    });
    rastreioDiv.style.display = marcadoCorreios ? 'block' : 'none';
  }
  checkboxes.forEach(function (cb) { cb.addEventListener('change', atualizar); });
})();
(function () {
  function ligarContador(idCampo, idContador) {
    var campo = document.getElementById(idCampo);
    var contador = document.getElementById(idContador);
    if (!campo || !contador) return;
    function atualizar() {
      contador.textContent = campo.value.length + "/" + campo.getAttribute("maxlength");
    }
    campo.addEventListener("input", atualizar);
    atualizar();
  }
  ligarContador("titulo", "contador-titulo");
  ligarContador("descricao", "contador-descricao");
})();
</script>
{% endblock %}
