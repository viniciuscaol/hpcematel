{% extends "base.html" %}
{% block title %}Login - {{ app_name }}{% endblock %}
{% block content %}
<div class="login-page">
  <form class="login-card" hx-post="/login" hx-target="#login-error" hx-swap="innerHTML">
    <div class="login-brand">
      <img src="/static/LOGO_TELEMEDICINA.svg" alt="Telemedicina da Bahia" class="login-logo-img">
    </div>
    <h1 class="login-titulo">{{ app_name }}</h1>
    <p class="subtitle">Entre com seu usuário do sistema</p>

    <label for="login">Usuário</label>
    <input type="text" id="login" name="login" required autofocus>

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required>

    <div id="login-error"></div>

    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
