{% extends "base.html" %}
{% block title %}Login - {{ app_name }}{% endblock %}
{% block content %}
<div class="login-page">
  <form class="login-card" hx-post="/login" hx-target="#login-error" hx-swap="innerHTML">
      <input type="hidden" name="next" value="{{ next }}">
    <div class="login-brand">
      <svg class="ecg-icon" width="26" height="18" viewBox="0 0 60 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polyline points="0,12 16,12 20,4 26,20 32,12 60,12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>{{ app_name }}</h1>
    </div>
    <p class="subtitle">Entre com seu usuário do sistema</p>

    <label for="login">Usuário</label>
    <input type="text" id="login" name="login" required autofocus>

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required>

    <div id="login-error"></div>

    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
