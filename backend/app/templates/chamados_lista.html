{% extends "base.html" %}
{% block title %}Chamados - {{ app_name }}{% endblock %}
{% block content %}
<div class="app-shell">
  {% include "partials/topbar.html" %}
  <main class="content">
    <div class="page-header">
      <h1>Chamados</h1>
      <a href="/chamados/novo" class="button-link">+ Novo Chamado</a>
    </div>

    <form class="filtro-area" hx-get="/chamados/tabela" hx-target="#chamados-tabela-area" hx-trigger="change, input delay:400ms" hx-swap="innerHTML" id="chamados-filtro-form">
      <input type="text" id="busca" name="busca" placeholder="Buscar por título, cliente, responsável ou nº..." value="{{ busca }}" style="min-width: 260px;">

      <label for="filtro">Mostrar:</label>
      <select id="filtro" name="filtro">
        <option value="abertos" {% if filtro == "abertos" %}selected{% endif %}>Em aberto (padrão)</option>
        <option value="todos" {% if filtro == "todos" %}selected{% endif %}>Todos os status</option>
      </select>

      <label for="data_inicio">De:</label>
      <input type="date" id="data_inicio" name="data_inicio" value="{{ data_inicio }}">
      <label for="data_fim">Até:</label>
      <input type="date" id="data_fim" name="data_fim" value="{{ data_fim }}">

      <button
        type="button"
        class="link-button"
        onclick="document.getElementById('data_inicio').value=''; document.getElementById('data_fim').value=''; document.getElementById('chamados-filtro-form').dispatchEvent(new Event('change', {bubbles:true}));"
      >Ver todas as datas</button>

      {% if cliente_codigo %}<input type="hidden" name="cliente_codigo" value="{{ cliente_codigo }}">{% endif %}
      {% if categoria_id %}<input type="hidden" name="categoria_id" value="{{ categoria_id }}">{% endif %}
    </form>

    <div id="chamados-tabela-area">
      {% include "partials/chamados_tabela.html" %}
    </div>
  </main>
</div>
{% endblock %}
