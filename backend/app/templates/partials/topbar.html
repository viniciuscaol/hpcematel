<header class="topbar">
  <span class="brand">
    <img src="/static/logo-telemedicina.png" alt="Telemedicina da Bahia" class="brand-logo-img">
  </span>
  <nav class="main-nav">
    <a href="/dashboard">Dashboard</a>
    <a href="/chamados">Chamados</a>
    <!-- <a href="/chamados/novo">Novo Chamado</a> -->
    {% if usuario.papel in ['TECNICO', 'ADMIN'] %}
    <a href="/tecnico">Técnico</a>
    {% endif %}
    {% if usuario.papel == 'ADMIN' %}
    <a href="/admin">Administração</a>
    <a href="/mapa">Mapa</a>
    {% endif %}
  </nav>
  <div class="user-menu">
    <span>{{ usuario.nome }}</span>
    <form hx-post="/logout"><button type="submit" class="link-button">Sair</button></form>
  </div>
</header>
