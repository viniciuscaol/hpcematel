name: Build e Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}



jobs:

  test:
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_helpdesk
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Rodar testes automatizados
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5433/test_helpdesk
          LEGACY_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5433/test_helpdesk
          JWT_SECRET_KEY: chave-de-teste-nao-usar-em-producao
          ENVIRONMENT: test
        run: pytest -v

  build:
    needs: test
    runs-on: self-hosted
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy-homologacao:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Migrar banco de homologação
        run: |
          bash scripts/migrate.sh chamados-cematel-homolog \
            "${{ env.IMAGE }}:${{ needs.build.outputs.tag }}" \
            "helpdesk-migrate-homolog-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Deploy em homologação
        run: |
          kubectl set image deployment/helpdesk-backend backend=${{ env.IMAGE }}:${{ needs.build.outputs.tag }} -n chamados-cematel-homolog
          kubectl rollout status deployment/helpdesk-backend -n chamados-cematel-homolog --timeout=120s

  deploy-producao:
    needs: [build, deploy-homologacao]
    runs-on: self-hosted
    timeout-minutes: 20
    environment:
      name: producao
    steps:
      - uses: actions/checkout@v4
      - name: Migrar banco de produção
        run: |
          bash scripts/migrate.sh chamados-cematel \
            "${{ env.IMAGE }}:${{ needs.build.outputs.tag }}" \
            "helpdesk-migrate-prod-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Deploy em produção
        run: |
          kubectl set image deployment/helpdesk-backend backend=${{ env.IMAGE }}:${{ needs.build.outputs.tag }} -n chamados-cematel
          kubectl rollout status deployment/helpdesk-backend -n chamados-cematel --timeout=120s
