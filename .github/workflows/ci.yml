name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_helpdesk
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_helpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5433/test_helpdesk
      LEGACY_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5433/test_helpdesk
      JWT_SECRET_KEY: chave-de-teste-nao-usar-em-producao
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Testar aplicação e migrações
        run: python -m pytest -v
