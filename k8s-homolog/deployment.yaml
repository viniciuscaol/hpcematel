apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-backend
  namespace: chamados-cematel-homolog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpdesk-backend
  template:
    metadata:
      labels:
        app: helpdesk-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/viniciuscaol/hpcematel:bootstrap
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: helpdesk-config
            - secretRef:
                name: helpdesk-secrets
          volumeMounts:
            - name: anexos
              mountPath: /app/anexos
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: anexos
          persistentVolumeClaim:
            claimName: helpdesk-anexos