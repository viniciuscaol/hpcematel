apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: chamados-cematel-homolog
spec:
  replicas: 1
  strategy:
    type: Recreate  # nunca dois pods de banco rodando ao mesmo tempo sobre o mesmo disco
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          envFrom:
            - secretRef:
                name: postgres-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata  # evita conflito com o "lost+found" que o Linux cria na raiz do volume
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "helpdesk_app"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "helpdesk_app"]
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data