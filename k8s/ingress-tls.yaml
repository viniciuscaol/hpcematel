apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpdesk-backend-tls
  namespace: chamados-cematel
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: chamados-cematel-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cematel.com.br
      secretName: cematel-tls
  rules:
    - host: cematel.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helpdesk-backend
                port:
                  number: 80