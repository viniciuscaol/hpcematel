apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-backend
  namespace: chamados-cematel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpdesk-backend
  template:
    metadata:
      labels:
        app: helpdesk-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/viniciuscaol/hpcematel:bootstrap
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          envFrom:
            - configMapRef:
                name: helpdesk-config
            - secretRef:
                name: helpdesk-secrets
          env:
            - name: MONITOR_SSH_KEY
              value: /run/monitoramento-ssh/id_rsa
            - name: MONITOR_SSH_KNOWN_HOSTS
              value: /run/monitoramento-ssh/known_hosts
          volumeMounts:
            - name: anexos
              mountPath: /app/anexos
            - name: monitoramento-ssh
              mountPath: /run/monitoramento-ssh
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: monitoramento-ssh
          secret:
            secretName: monitoramento-ssh
            optional: true
            defaultMode: 0444
        - name: anexos
          persistentVolumeClaim:
            claimName: helpdesk-anexos