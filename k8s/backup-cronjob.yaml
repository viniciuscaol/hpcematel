apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-diario
  namespace: chamados-cematel
spec:
  schedule: "0 5 * * *"  # 05:00 UTC = 02:00 em Salvador (fora do horário de uso)
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
              memory: "512Mi"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: postgres-secrets, key: HELPDESK_APP_PASSWORD }
                - name: RCLONE_CONFIG
                  value: /rclone/rclone.conf
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  apk add --no-cache curl unzip tar >/dev/null
                  curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
                  unzip -q /tmp/rclone.zip -d /tmp
                  mv /tmp/rclone-*-linux-amd64/rclone /usr/local/bin/
                  chmod +x /usr/local/bin/rclone

                  DIA_SEMANA=$(date +%a)
                  DATA_COMPLETA=$(date +%Y-%m-%d)
                  mkdir -p /backup

                  echo "Gerando dump do banco (sobrescreve o do mesmo dia da semana)..."
                  pg_dump -h postgres -U helpdesk_app -d helpdesk -F c -f /backup/helpdesk-$DIA_SEMANA.dump

                  echo "Compactando anexos (mantido para sempre, um arquivo por dia)..."
                  tar -czf /backup/anexos-$DATA_COMPLETA.tar.gz -C /app anexos

                  echo "Enviando para o Google Drive..."
                  rclone copy /backup/helpdesk-$DIA_SEMANA.dump gdrive:backups-helpdesk/banco/ --no-update-modtime
                  rclone copy /backup/anexos-$DATA_COMPLETA.tar.gz gdrive:backups-helpdesk/anexos/

                  echo "Backup concluido: banco ($DIA_SEMANA) e anexos ($DATA_COMPLETA)"
              volumeMounts:
                - { name: rclone-config, mountPath: /rclone }
                - { name: anexos, mountPath: /app/anexos }
                - { name: backup-temp, mountPath: /backup }
          volumes:
            - name: rclone-config
              secret: { secretName: rclone-config }
            - name: anexos
              persistentVolumeClaim: { claimName: helpdesk-anexos }
            - name: backup-temp
              emptyDir: {}